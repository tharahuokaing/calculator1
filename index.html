<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Currency Calculator | Huokaing Thara Banking System</title>
    <link rel="stylesheet" href="calculator.css">
    <link rel="icon" href="bank.jpg" type="image/jpeg">
</head>
<body>

    <div class="bank-logo-wrapper">
        <img src="bank.jpg" alt="Bank Logo" class="bank-logo-img">
    </div>

    <div class="calculator-container">
        <h2>Country Rate Calculator</h2>
        <p class="subtitle">Real-time multi-currency converter with daily automated rate updates.</p>

        <div class="rate-status-banner">
            <span>📅 Rate Status: <strong id="lastUpdatedText">Updating daily...</strong></span>
        </div>

        <div class="form-group">
            <label for="amountInput">Amount to Convert ($ USD Base)</label>
            <input type="number" id="amountInput" value="1" min="0" step="0.01">
        </div>

        <div class="conversion-results">
            <h3>Converted Country Values</h3>
            <ul id="rateList" class="rate-list">
                <!-- Dynamically populated via JavaScript -->
            </ul>
        </div>

        <div class="action-footer">
            <a href="https://tharahuokaing.github.io/bank2/" class="btn-link">Return to Dashboard</a>
        </div>
    </div>

    <script src="calculator.js"></script>
    <script src="ultra_secure_mode.js"></script>
    
</body>
</html>
